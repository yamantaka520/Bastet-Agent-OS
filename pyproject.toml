[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bastet-agent-os"
dynamic = ["version"]
description = "Local-first operating system for AI-agent teams: resource governance, gated workflows, and multi-project orchestration on top of Agent Memory OS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "yamantaka520" }]
keywords = ["ai", "agents", "orchestration", "multi-agent", "local-first", "llm-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Framework :: FastAPI",
]
dependencies = [
    "agent-memory-os",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",   # chat file uploads (UploadFile)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
sdk = ["claude-agent-sdk"]     # claude-sdk executor (in-run interactions)
keyring = ["keyring"]

[project.urls]
Homepage = "https://github.com/yamantaka520/Bastet-Agent-OS"
Documentation = "https://github.com/yamantaka520/Bastet-Agent-OS/blob/main/docs/USER_GUIDE.md"
Changelog = "https://github.com/yamantaka520/Bastet-Agent-OS/blob/main/CHANGELOG.md"
Issues = "https://github.com/yamantaka520/Bastet-Agent-OS/issues"

[project.scripts]
bastet = "bastet_agent_os.cli:app"

[tool.hatch.version]
path = "src/bastet_agent_os/__init__.py"

[project.entry-points."bastet.executors"]
# executor plugins register here; see SPEC.md §5.1

[tool.hatch.build.targets.wheel]
packages = ["src/bastet_agent_os"]

[tool.pytest.ini_options]
# macOS keeps re-flagging the editable-install .pth as hidden, which makes
# Python skip it; tests import from src/ directly instead.
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in SQL/strings are fine

[tool.ruff.lint.per-file-ignores]
# B008 flags `Depends(...)` in defaults — that IS the FastAPI idiom
"src/bastet_agent_os/server.py" = ["B008"]
