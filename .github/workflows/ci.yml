name: CI

on:
  push:
    branches: [main]
  pull_request:
  # a push does not always produce a run: during GitHub's 2026-08-06 Actions
  # incident webhooks were throttled to ~15%, so commits landed with no CI at
  # all. This makes a run something you can ask for.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    # Windows is red across ~35 tests: the fake-executor fixtures are POSIX
    # shell scripts, several assertions assume forward-slash paths, and CJK
    # error messages hit cp1252 logs. Real Windows support needs its own pass
    # (tracked in PROGRESS.md) — until then the leg reports but does not block,
    # because a check that is always red checks nothing.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src/ tests/
      - name: Test
        run: pytest -q

  # The leg that would have caught 0.23.2: inside a python:3.12-slim container —
  # the base of the image we publish — the interpreter lives in /usr/local/bin,
  # which is also one of Bastet's TOOL_DIRS. Hosted runners keep python in
  # hostedtoolcache, so PATH-order behaviour there says nothing about what the
  # shipped artefact does.
  image-base:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: git (worktrees are the unit of work, and checkout wants it)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git
      - uses: actions/checkout@v5
      - name: Identity for the worktree tests
        run: |
          git config --global user.email ci@bastet.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pip install -e '.[dev]'
      - run: pytest -q
