name: CI

on:
  push:
    branches: [main]
  pull_request:
  # a push does not always produce a run: during GitHub's 2026-08-06 Actions
  # incident webhooks were throttled to ~15%, so commits landed with no CI at
  # all. This makes a run something you can ask for.
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src/ tests/
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Built WebUI must match the wheel payload
        run: git diff --exit-code -- src/bastet_agent_os/ui_dist

  # The leg that would have caught 0.23.2: inside a python:3.12-slim container —
  # the base of the image we publish — the interpreter lives in /usr/local/bin,
  # which is also one of Bastet's TOOL_DIRS. Hosted runners keep python in
  # hostedtoolcache, so PATH-order behaviour there says nothing about what the
  # shipped artefact does.
  image-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: python:3.12-slim
    steps:
      - name: git (worktrees are the unit of work, and checkout wants it)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git
      - uses: actions/checkout@v5
      - name: Identity for the worktree tests
        run: |
          git config --global user.email ci@bastet.invalid
          git config --global user.name CI
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pip install -e '.[dev]'
      - run: pytest -q
