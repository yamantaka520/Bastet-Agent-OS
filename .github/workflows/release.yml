# Release: GitHub Release + PyPI (Trusted Publishing) + Docker Hub, on every v* tag.
#
# Publishing is OFF until the maintainer completes the one-time setup in their
# own accounts (nothing here can do it for them). Until then the tag is still
# checked — version match, wheel builds, artifact uploaded — and no publish job
# runs at all, so nothing goes red and no `pypi` deployment record is created
# over a credential nobody configured.
#
#   PyPI  → project bastet-agent-os → Publishing → add GitHub publisher:
#           owner yamantaka520, repo Bastet-Agent-OS,
#           workflow release.yml, environment pypi
#           (no token ends up in GitHub — that is the point of Trusted Publishing)
#   GitHub → repo Settings → Environments → create "pypi"
#           → repo Settings → Variables → PUBLISH_TO_PYPI = true (the switch)
#   Docker Hub → Account Settings → Personal access tokens → new token, then
#   GitHub → repo Settings → Secrets → DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          PKG=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/bastet_agent_os/__init__.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "tag v$TAG != __version__ $PKG"; exit 1; }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - if: vars.PUBLISH_TO_PYPI != 'true'
        run: echo "::notice::PUBLISH_TO_PYPI is not set — the wheel was built and verified, not published. See this workflow's header for the one-time Trusted Publishing setup."

  # a separate job so the `pypi` environment — and the deployment record that
  # comes with it — only exists once publishing is actually switched on
  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing: OIDC, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

  docker:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be read in a job-level `if`, so the gate lives in env
      CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - if: env.CONFIGURED != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set — skipping the image build and push. See this workflow's header."
      - if: env.CONFIGURED == 'true'
        uses: actions/checkout@v5
      - if: env.CONFIGURED == 'true'
        uses: docker/setup-buildx-action@v3
      - if: env.CONFIGURED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        if: env.CONFIGURED == 'true'
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - if: env.CONFIGURED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bastet-agent-os:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bastet-agent-os:${{ steps.version.outputs.v }}
