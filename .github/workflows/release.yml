# Release: PyPI (Trusted Publishing) + Docker Hub, on every v* tag.
#
# One-time setup, in the maintainer's accounts (nothing here can do it for you):
#   PyPI  → project bastet-agent-os → Publishing → add GitHub publisher:
#           owner yamantaka520, repo Bastet-Agent-OS,
#           workflow release.yml, environment pypi
#           (no token ends up in GitHub — that is the point of Trusted Publishing)
#   GitHub → repo Settings → Environments → create "pypi"
#   Docker Hub → Account Settings → Personal access tokens → new token, then
#   GitHub → repo Settings → Secrets → DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing: OIDC, no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          PKG=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/bastet_agent_os/__init__.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "tag v$TAG != __version__ $PKG"; exit 1; }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bastet-agent-os:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bastet-agent-os:${{ steps.version.outputs.v }}
